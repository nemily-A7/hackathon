var layerMap = {'c0':[],'c1':[],'c2':[],'c3':[],'c4':[]};
var aisMarkers = [], radMarkers = [], lines = [];

function getLayerKey(r) {
  if (r === 0)    return 'c0';
  if (r < 1000)   return 'c1';
  if (r < 5000)   return 'c2';
  if (r < 10000)  return 'c3';
  return 'c4';
}

ships.forEach(function(s) {
  var key = getLayerKey(s.resid);
  var popup = '<b>' + s.name + '</b> — ' + s.flag + '<br>' +
    'Type : ' + s.type + (s.susp ? ' &nbsp;⚠️ SUSPECT' : '') + '<br>' +
    '<hr style="margin:3px 0">' +
    'Résidu : <b>' + s.resid + ' km</b><br>' +
    'Écart brut : ' + s.dist + ' km<br>' +
    'Max atteignable : ' + s.reach + ' km<br>' +
    'Delta t : ' + s.delta + 'h | ' + s.speed + ' kt<br>' +
    '<small>AIS : ' + s.ais_lat + '°, ' + s.ais_lon + '°<br>' +
    'Radio : ' + s.rad_lat + '°, ' + s.rad_lon + '°</small>';

  // AIS marker
  var aisM = L.circleMarker([s.ais_lat, s.ais_lon], {
    radius:5, color:'#2471a3', weight:2,
    fillColor:'#2471a3', fillOpacity:0.9
  }).bindPopup(popup).bindTooltip(s.name + ' — AIS');
  aisMarkers.push(aisM);
  layerMap[key].push(aisM);
  aisM.addTo(map);

  // Radio marker
  var radM = L.circleMarker([s.rad_lat, s.rad_lon], {
    radius:4, color:s.color, weight:2,
    fillColor:s.color, fillOpacity:0.9
  }).bindPopup(popup).bindTooltip(s.name + ' — Radio (' + s.resid + ' km)');
  radMarkers.push(radM);
  layerMap[key].push(radM);
  radM.addTo(map);

  // Line
  var line = L.polyline([[s.ais_lat,s.ais_lon],[s.rad_lat,s.rad_lon]], {
    color:s.color, weight:1.2, opacity:0.4
  });
  lines.push(line);
  layerMap[key].push(line);
  line.addTo(map);
});

function toggleLayer(id) {
  var on = document.getElementById(id).checked;
  layerMap[id].forEach(function(m) { on ? m.addTo(map) : map.removeLayer(m); });
}
function toggleAIS() {
  var on = document.getElementById('cAIS').checked;
  aisMarkers.forEach(function(m) { on ? m.addTo(map) : map.removeLayer(m); });
}
function toggleRAD() {
  var on = document.getElementById('cRAD').checked;
  radMarkers.forEach(function(m) { on ? m.addTo(map) : map.removeLayer(m); });
}
function toggleLINE() {
  var on = document.getElementById('cLINE').checked;
  lines.forEach(function(m) { on ? m.addTo(map) : map.removeLayer(m); });
}
